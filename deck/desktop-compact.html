<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 第 6 頁桌機版：內容沿用 design/deck-handoff/desktop.html（TARS）的三個 abstract-concepts 頁；可可 9/9 依米奇要求拿掉一句話說明與視覺關鍵字，只留名字＋畫面，預覽吃滿高度。沒動 design -->
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"PingFang TC",sans-serif;color:#1d1d1f;background:transparent}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;height:100%;align-content:start}
article{min-width:0}
h2{font-size:24px;margin:0 0 10px;line-height:1.2}
h2 span{font-size:19px;font-weight:500;margin-left:12px}
.preview{position:relative;width:100%;overflow:hidden;border:1px solid #e3e6ea;border-radius:8px}
.scale{position:absolute;top:0;left:0;transform-origin:0 0}
iframe{display:block;width:1000px;height:850px;border:0;overflow:hidden}
</style>
<body><div class="grid">
<article><h2>GoNexus<span>匯流站</span></h2><div class="preview"><div class="scale"><iframe title="GoNexus" src="../design/abstract-concepts/curation.html?v=meeting-final2"></iframe></div></div></article>
<article><h2>GoNetwork<span>倉聯網</span></h2><div class="preview"><div class="scale"><iframe title="GoNetwork" src="../design/abstract-concepts/network.html?v=meeting-final2"></iframe></div></div></article>
<article><h2>GoAtlas<span>物流圖鑑</span></h2><div class="preview"><div class="scale"><iframe title="GoAtlas" src="../design/abstract-concepts/journal.html?v=meeting-final2"></iframe></div></div></article>
</div>
<script>
const W=1000;
function fit(){for(const card of document.querySelectorAll('article')){const preview=card.querySelector('.preview'),layer=card.querySelector('.scale'),frame=card.querySelector('iframe');const scale=(card.clientWidth-2)/W;const H=850;preview.style.height=Math.round(H*scale)+2+'px';layer.style.width=W+'px';layer.style.height=H+'px';layer.style.transform='scale('+scale+')'}}
function hideBars(frame){try{const d=frame.contentDocument;if(!d||!d.head||d.getElementById('koko-nobar'))return;const style=d.createElement('style');style.id='koko-nobar';style.textContent='html{overflow-y:auto!important;scrollbar-width:none!important}body{overflow:visible!important;scrollbar-width:none!important}::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}*{scrollbar-width:none!important;-ms-overflow-style:none!important}*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}'+'';d.head.append(style)}catch(e){}}
for(const frame of document.querySelectorAll('iframe')){frame.addEventListener('load',()=>{hideBars(frame);fit()});if(frame.contentDocument&&frame.contentDocument.readyState!=='loading')hideBars(frame)}
new ResizeObserver(fit).observe(document.body);fit();
</script></body></html>
